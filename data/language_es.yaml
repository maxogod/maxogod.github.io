about:
    title: "Sobre mí"
    subtitle: "Ingeniería en informática, Universidad de Buenos Aires"
    text: "Hola, mi nombre es Máximo Utrera. Soy Ingeniero en Informática, con pasión por el desarrollo de software y una sólida base en varios lenguajes de programación y tecnologías. Me he dedicado a perfeccionar mis habilidades a través de cursos académicos, proyectos personales y experiencias profesionales, y estoy comprometido a aplicar este conocimiento para resolver problemas del mundo real y crear soluciones innovadoras."
    portrait: "Máximo sonriendo en un bote sobre un lago"
    toolboxTitle: "Con qué trabajo"
    toolbox:
        - label: "Lenguajes"
          items: ["Go", "Python", "TypeScript", "Rust", "C++", "Java"]
        - label: "Infraestructura"
          items: ["AWS", "Terraform", "Kubernetes", "Nomad", "Docker", "Datadog"]
        - label: "Sistemas"
          items: ["Sistemas distribuidos", "Microservicios", "RabbitMQ", "PostgreSQL", "MongoDB"]
        - label: "Juegos e IA"
          items: ["Unity", "Godot", "PyTorch", "TensorFlow"]
    photosCaption: "Fiubaton 2023, ganadores del desafío de inteligencia artificial"
    photos:
        - "Presentando nuestro proyecto en el escenario de la Fiubaton"
        - "Agradeciendo a los organizadores de la Fiubaton"
        - "El equipo ganador con sus certificados"

