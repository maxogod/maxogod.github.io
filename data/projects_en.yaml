    - name: "AlaCarta"
      description: "Full-stack backoffice platform for restaurants to manage menus, orders and staff, with a customer-facing ordering page. Built with the MERN stack, TypeScript, Redux and Tailwind CSS.<br><br>Key features include:<br>- Role-based access for owners, managers and employees, onboarded through email invitations with unique codes.<br>- Real-time order handling where employees accept or reject incoming orders.<br>- Sales analytics with revenue over time and best-selling product breakdowns.<br>- Customizable menu branding and per-restaurant management."
      image: "assets/alacarta.png"
      url: "https://github.com/maxogod/AlaCarta"
