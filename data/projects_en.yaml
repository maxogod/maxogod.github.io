datasci_projects:
    - name: "RAG API for Studying"
      description: "FastAPI Retrieval-Augmented Generation service built to study for final exams by asking questions directly to the source books.<br><br>PDFs are chunked, embedded and indexed in a pgvector-backed PostgreSQL vector store. Each question triggers a semantic similarity search, and the most relevant passages are fed as context to an LLM (Llama 4 Scout) through LangChain.<br><br>Key features include:<br>- Bibliography-grounded answers that reduce hallucinations and stay traceable to the original books.<br>- Modular design with swappable embedding model, vector store and LLM."
      image: "assets/rag.jpg"
      url: "https://github.com/maxogod/student-rag-api"
      vid: ""
      technologies:
          ["LLM", "RAG", "LangChain", "FastAPI", "PostgreSql", "pgvector", "Docker", "Python"]
    - name: "Brain Tumor Segmentation"
      description: "Deep learning pipeline for automatic 3D segmentation of brain tumors in multimodal MRI scans, inspired by the BraTS challenge and built as a University of Buenos Aires Deep Learning project.<br><br>A custom 3D U-Net (5.6M parameters) takes T1CE, T2 and FLAIR volumes and delineates the three tumor tissue classes (necrotic core, edema and enhancing tumor) voxel by voxel, trained on 369 clinical cases after a preprocessing pipeline of intensity normalization, spatial cropping and filtering of poorly annotated volumes.<br><br>Key features include:<br>- Class-imbalance handling with a weighted Dice-Focal loss, mixed-precision training and cosine annealing learning rate scheduling.<br>- Test-time augmentation and a model ensemble for more robust predictions.<br>- 0.73 mean Dice Score and 0.61 IoU on a held-out validation set, selected from over 20 trained models.<br>- Training adapted to constrained GPU memory (4 to 16 GB VRAM) across local and cloud environments."
      image: "assets/brain.jpg"
      url: "https://github.com/maxogod/Brain-Tumor-Segmentation"
      vid: ""
      technologies:
          ["Deep Learning", "Computer Vision", "Pytorch", "Numpy", "Python"]
    - name: "Deep Learning - University of Buenos Aires"
      description: "In the following three projects, different neural network architectures and applications were explored, mostly using only the NumPy library, and occasionally PyTorch.<br><br>The first focused on Hopfield networks, evaluating their memory retrieval capacity under various conditions.<br><br>The second addressed classical classification and regression problems using simple and multilayer perceptrons, Boltzmann machines, convolutional networks, and autoencoders, also including other methods such as simulated annealing and genetic algorithms.<br><br>The third concentrated on Kohonen Self-Organizing Maps (SOM), applied to the representation of geometric distributions, approximate solutions to the traveling salesman problem, and dimensionality reduction for clustering analysis, highlighting their ability to preserve topologies and uncover hidden structures in the data."
      image: "assets/dl.png"
      url: "https://github.com/maxogod/DeepLearning"
      vid: ""
      technologies: ["Deep Learning", "Numpy", "Pytorch", "Python"]
    - name: "Donkey Kong AI"
      description: "The project focuses on training an AI agent to complete the first level of Donkey Kong using reinforcement learning with the Proximal Policy Optimization (PPO) algorithm. <br><br> The environment was built in Unity with ML-Agents, and the model was trained using PyTorch. The agent learns to avoid barrels, climb ladders, and rescue the princess through dynamic interaction and a well-designed reward system. Hyperparameter tuning and iterative testing ensured stable and adaptive performance, demonstrating the effectiveness of reinforcement learning in complex game environments."
      image: "assets/donkey.jpg"
      url: "https://github.com/maxogod/AI-Donkey-Kong"
      vid: "https://www.youtube.com/watch?v=5XQuDkWKL-M"
      technologies: ["Unity", "Pytorch", "Conda", "Reinforcement Learning"]
    - name: "Property Price Analysis & Prediction"
      description: "End-to-end machine learning study of the Buenos Aires real estate market, starting from a 460k-listing dataset extracted with BigQuery and narrowed to 94k houses, apartments and PH properties in the city after cleaning and imputation.<br><br>Key features include:<br>- Data preprocessing with outlier treatment, imputation of missing neighborhoods and feature engineering.<br>- K-Means clustering and geographic price analysis, with K chosen through the elbow method and silhouette score.<br>- Low/mid/high price classification using Decision Trees, Random Forest and XGBoost, tuned with 5-fold cross-validation, where XGBoost performed best.<br>- Price regression with KNN, XGBoost and Decision Trees evaluated with MSE, RMSE and R2."
      image: "assets/ai.png"
      url: "https://github.com/maxogod/DATA-SCIENCE/blob/main/TP1/7506R_TP1_GRUPO02_REPORTE.pdf"
      vid: ""
      technologies:
          ["Machine Learning", "Python", "ScikitLearn", "Pandas", "GoogleColab"]
    - name: "Natural Languaje Processing"
      description: "[Kaggle Competition] Sentiment classifier for Spanish movie reviews, combining classical ML and deep learning on top of an NLP pipeline of tokenization, stopword removal, POS tagging and lemmatization (NLTK and spaCy).<br><br>Naive Bayes, Random Forest, XGBoost and a Keras neural network were tuned with cross-validation and combined into a voting ensemble that reached 0.92 F1 on validation."
      image: "assets/nlp.png"
      url: "https://github.com/maxogod/DATA-SCIENCE/blob/main/TP2/7506R_TP2_GRUPO02_REPORTE.pdf"
      vid: ""
      technologies:
          [
              "Machine Learning",
              "Python",
              "TensorFlow",
              "ScikitLearn",
              "Pandas",
              "GoogleColab",
          ]
    - name: "Extract, Transform & Load Real Estate Data"
      description: "ETL pipeline over a Kaggle dataset of more than one million real estate sales (2001 to 2020), built for a Databases course.<br><br>Key features include:<br>- Data cleaning: null handling, z-score outlier filtering, format standardization and duplicate removal.<br>- Schema redesign and loading into a SQLite database normalized to Boyce-Codd Normal Form (BCNF).<br>- Integrity validation by reconstructing the original dataset from the normalized tables."
      image: "assets/etl.png"
      url: "https://github.com/maxogod/ETL-Real-Estate/blob/main/informe.pdf"
      vid: ""
      technologies: ["Python", "GoogleColab", "Pandas", "SQL"]
    - name: "Check out my github for more!"
      more: true
      description: ""
      image: "assets/gh.png"
      url: "https://github.com/maxogod"
      vid: ""
      technologies: []

