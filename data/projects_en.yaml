    - name: "GymChad"
      description: "Full-stack fitness organizer to plan activities such as dancing or boxing and the exercises that belong to each one, with images, notes, sets/reps or duration. Responsive Angular frontend backed by a separate Spring Boot REST API.<br><br>Features Google sign-in with session-based authentication and per-user data ownership checks. Deployed on Render."
