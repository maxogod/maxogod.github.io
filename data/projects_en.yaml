sys_projects:
    - name: "Feed the Realm"
      description: "MMO RPG Maker platform where players build persistent 3D worlds with a no-code World Editor, publish them, and play them online alongside hundreds of concurrent players. Built as our Software Engineering capstone at the University of Buenos Aires.<br><br>Each world is sharded into zones, each one an authoritative headless Unity server running in its own Docker container, deployed on demand and scaled horizontally. A Go (Gin) Core Service, designed as a modular monolith behind an Nginx API Gateway, handles auth, assets, Stripe payments and world orchestration, backed by PostgreSQL and a per-world MongoDB database that keeps player state consistent across zones.<br><br>Key features include:<br>- AWS infrastructure as code with Terraform: EC2, S3 + CloudFront CDN, ECR, Route 53 public/private DNS, least-privilege IAM and SSM-managed secrets.<br>- On-demand game server orchestration with HashiCorp Nomad (chosen over Kubernetes to avoid rescheduling live sessions) and Consul service discovery by world/zone ID.<br>- Server-authoritative networking over KCP/UDP with Mirror and Protobuf, a fixed-rate tick loop and per-tick command budgets to absorb traffic spikes.<br>- GitHub Actions CI/CD with keyless OIDC deploys, 75%+ test coverage, BDD acceptance tests, secret and vulnerability scanning, and automatic redeploy of live game servers on each release.<br>- Datadog observability with custom tick-level metrics, dashboards and alerting.<br>- Load tested with custom bots: ~550 concurrent players across 7 zones on two 2 vCPU / 2 GB nodes with stable tick times."
      image: "assets/ftr.jpg"
      url: "https://github.com/FeedTheRealm-org"
      vid: ""
      technologies:
          [
              "Distributed Systems",
              "AWS",
              "Terraform",
              "Nomad",
              "Go",
              "Unity",
              "Datadog",
          ]
    - name: "ClassConnect"
      description: "ClassConnect is a cloud-native educational platform built on a distributed microservices architecture. It features a Kubernetes-based deployment, managed via Infrastructure as Code and automated with CI/CD pipelines. Monitoring is handled through Datadog for full observability. <br><br> The system supports both a React Native mobile app (for teachers and students) and a React web app (for administrators). It includes six microservices developed in Go (Gin Gonic) and Python (FastAPI), each with its own database using Supabase or MongoDB Atlas, all with >75% test coverage. An additional AI microservice powered by Gemini 2.0 Flash enables LLM-based assistance."
      image: "assets/cc.png"
      url: "https://github.com/ClassConnect-org"
      vid: "https://www.youtube.com/watch?v=MnToP9unGNQ"
      technologies:
          [
              "Microservices",
              "Datadog",
              "Cloud-Computing",
              "LLM",
              "Kubernetes",
              "Kong-Gateway",
          ]
    - name: "Distributed Sales Analysis System"
      description: "Fault-tolerant distributed system designed to process and analyze large-scale transaction data.<br><br>The architecture is based on a message-driven pipeline using RabbitMQ, where independent worker nodes process data in stages, enabling horizontal scalability and high throughput.<br><br>Key features include:<br>- End-to-end distributed data pipelines for filtering, aggregation, ranking, and joins.<br>- Strong fault tolerance via deferred ACKs, disk persistence, idempotent messages, and duplicate handling.<br>- Automatic node recovery. <br>- Robustness, consistency, and resilience under partial and catastrophic failures."
      image: "assets/distro.jpg"
      url: "https://github.com/maxogod/distributed-processing-pipeline"
      vid: "https://youtu.be/L9Zhzpqamks"
      technologies:
          [
              "Distributed Systems",
              "RabbitMQ",
              "Docker",
              "Go",
              "Python",
          ]
    - name: "SDN Firewall"
      description: "Software-Defined Networking (SDN) solution featuring a dynamic firewall built with POX and Mininet.<br><br>The project follows a modular Docker-based architecture that separates network emulation from controller logic, and uses Python 3 (with custom patches for POX compatibility).<br><br>Key features include:<br>- JSON-based configuration for defining IP, port, and protocol filtering rules.<br>- Centralized traffic control over OpenFlow switches via the POX controller.<br>- Automated testing and traffic validation using Mininet and Wireshark.<br><br>The system supports practical scenarios such as blocking HTTP traffic, dropping UDP flows, and restricting communication between specific hosts. It also addresses challenges like Python 3 migration and testing in more complex topologies."
      image: "assets/firewall.jpg"
      url: ""
      vid: ""
      technologies: ["Pox", "Mininet", "Wireshark", "Python"]
    - name: "RDT protocol over UDP"
      description: "Reliable file transfer protocol built over UDP. The project implements two recovery strategies—Stop-and-Wait and Go-Back-N—designed to handle high packet loss and maintain connection integrity.<br><br>The server uses an asynchronous architecture that supports multiple concurrent clients, with custom packet headers for tracking sequence and acknowledgment numbers.<br><br>Key features include:<br>- 6-byte application-layer header with sequence/ACK support.<br>- Connection multiplexing with event-driven server logic.<br>- Mininet-tested: Go-Back-N achieved 2.8× speedup under 20% packet loss.<br><br>The project focused on building a lightweight, robust protocol with strong fault tolerance and real-time performance analysis in emulated networks."
      image: "assets/udp.jpg"
      url: "https://github.com/maxogod/RDT-over-UDP"
      vid: ""
      technologies: ["Mininet", "Wireshark", "Python"]
    - name: "ConcuRide"
      description: "Fault-tolerant distributed ride-matching system in Rust, built on the actor model (Actix) with four independent applications (passengers, drivers, admin nodes and a payment gateway) communicating over TCP.<br><br>A cluster of replicated admin nodes elects a coordinator through a ring election algorithm and keeps matching trips even when nodes or clients fail.<br><br>Key features include:<br>- Lock-free concurrency: state is owned by actors and protected by message mailboxes instead of locks.<br>- Automatic coordinator re-election and client failover when the coordinator goes down.<br>- Trip flow with payment authorization, nearest-driver matching and round-robin load distribution across admins.<br>- Recovery from disconnections at any point of a trip, including double-charge prevention and unresponsive driver reaping."
      image: "assets/concuride.jpg"
      url: "https://github.com/maxogod/ConcuRide"
      vid: "https://www.youtube.com/watch?v=8ktItIcETTw&ab_channel=MaxoFiuba"
      technologies: ["Rust"]
    - name: "Check out my github for more!"
      more: true
      description: ""
      image: "assets/gh.png"
      url: "https://github.com/maxogod"
      vid: ""
      technologies: []

