datasci_projects:
    - name: "RAG API para Estudiar"
      short_name: "rag-api"
      description: "Servicio FastAPI de Retrieval-Augmented Generation creado para estudiar para los finales haciéndole preguntas directamente a los libros fuente.<br><br>Los PDFs se dividen en chunks, se convierten en embeddings y se indexan en un vector store PostgreSQL con pgvector. Cada pregunta dispara una búsqueda semántica por similitud, y los pasajes más relevantes se envían como contexto a un LLM (Llama 4 Scout) mediante LangChain.<br><br>Características principales:<br>- Respuestas fundamentadas en la bibliografía que reducen las alucinaciones y se mantienen trazables a los libros originales.<br>- Diseño modular con modelo de embeddings, vector store y LLM intercambiables."
      image: "assets/rag.jpg"
      url: "https://github.com/maxogod/student-rag-api"
      vid: ""
      technologies:
          ["LLM", "RAG", "LangChain", "FastAPI", "PostgreSql", "pgvector", "Docker", "Python"]
    - name: "Segmentación de Tumores Cerebrales"
      short_name: "brain-tumor"
      description: "Pipeline de aprendizaje profundo para la segmentación 3D automática de tumores cerebrales en resonancias magnéticas multimodales, inspirado en el desafío BraTS y desarrollado como proyecto de Aprendizaje Profundo en la Universidad de Buenos Aires.<br><br>Una U-Net 3D propia (5.6M de parámetros) recibe volúmenes T1CE, T2 y FLAIR y delimita voxel a voxel las tres clases de tejido tumoral (núcleo necrótico, edema y tumor realzado), entrenada con 369 casos clínicos tras un preprocesamiento de normalización de intensidades, recorte espacial y descarte de volúmenes con poca anotación.<br><br>Características principales:<br>- Manejo del desbalance de clases con una pérdida Dice-Focal ponderada, entrenamiento con precisión mixta y cosine annealing como política de tasa de aprendizaje.<br>- Test-time augmentation y ensamble de modelos para predicciones más robustas.<br>- Dice Score medio de 0.73 e IoU de 0.61 sobre un conjunto de validación, seleccionado entre más de 20 modelos entrenados.<br>- Entrenamiento adaptado a memoria de GPU limitada (4 a 16 GB de VRAM) en entornos locales y en la nube."
      image: "assets/brain.jpg"
      url: "https://github.com/maxogod/Brain-Tumor-Segmentation"
      vid: ""
      technologies:
          ["Deep Learning", "Computer Vision", "Pytorch", "Numpy", "Python"]
    - name: "Aprendizaje profundo - Universidad de Buenos Aires"
      short_name: "deep-learning-uba"
      description: "En los tres siguientes proyectos se exploraron distintas arquitecturas y aplicaciones de redes neuronales mayormente utilizando solamente la libreria numpy, y ocacionalmente pytorch.<br><br>El primero se centró en redes de Hopfield, evaluando su capacidad de recuperación de memoria bajo diversas condiciones.<br><br>El segundo abordó problemas clásicos de clasificación y regresión mediante perceptrones simples y multicapa, máquinas de Boltzmann, redes convolucionales y autoencoders, incluyendo también otros métodos como simulated annealing y algoritmos genéticos.<br><br>El tercero se enfocó en redes auto-organizadas de Kohonen (SOM), aplicadas a la representación de distribuciones geométricas, la resolución aproximada del problema del viajero y la reducción de dimensionalidad para análisis de clustering, destacando su capacidad para preservar topologías y descubrir estructuras ocultas en los datos."
      image: "assets/dl.png"
      url: "https://github.com/maxogod/DeepLearning"
      vid: ""
      technologies: ["Deep Learning", "Numpy", "Pytorch", "Python"]
    - name: "Donkey Kong AI"
      short_name: "donkey-kong-ai"
      description: "El proyecto se centra en entrenar a un agente de IA para completar el primer nivel de Donkey Kong utilizando aprendizaje por refuerzo con el algoritmo de Proximal Policy Optimization (PPO). <br><br> El entorno se desarrolló en Unity con ML-Agents, y el modelo se entrenó usando PyTorch. El agente aprende a esquivar barriles, subir escaleras y rescatar a la princesa mediante interacción dinámica y un sistema de recompensas bien diseñado. La optimización de hiperparámetros y pruebas iterativas garantizaron un rendimiento estable y adaptativo, demostrando la efectividad del aprendizaje por refuerzo en entornos complejos de videojuegos."
      image: "assets/donkey.jpg"
      url: "https://github.com/maxogod/AI-Donkey-Kong"
      vid: "https://www.youtube.com/watch?v=5XQuDkWKL-M"
      technologies: ["Unity", "Pytorch", "Conda", "Reinforcement Learning"]
    - name: "Análisis y Predicción de Precios de Propiedades"
      short_name: "property-prices"
      description: "Estudio de machine learning de punta a punta del mercado inmobiliario de Buenos Aires, a partir de un dataset de 460 mil publicaciones extraído con BigQuery y reducido a 94 mil casas, departamentos y PH de la ciudad tras la limpieza y la imputación.<br><br>Características principales:<br>- Preprocesamiento con tratamiento de outliers, imputación de barrios faltantes e ingeniería de características.<br>- Clusterización K-Means y análisis geográfico de precios, con K elegido mediante el método del codo y el silhouette score.<br>- Clasificación de precios bajo/medio/alto con árboles de decisión, Random Forest y XGBoost, ajustados con validación cruzada de 5 folds, donde XGBoost tuvo el mejor desempeño.<br>- Regresión de precios con KNN, XGBoost y árboles de decisión evaluados con MSE, RMSE y R2."
      image: "assets/ai.png"
      url: "https://github.com/maxogod/DATA-SCIENCE/blob/main/TP1/7506R_TP1_GRUPO02_REPORTE.pdf"
      vid: ""
      technologies:
          ["Machine Learning", "Python", "ScikitLearn", "Pandas", "GoogleColab"]
    - name: "Procesamiento de Lenguaje Natural"
      short_name: "nlp"
      description: "[Competencia de Kaggle] Clasificador de sentimiento de reseñas de películas en español, que combina ML clásico y aprendizaje profundo sobre un pipeline de NLP con tokenización, eliminación de stopwords, POS tagging y lematización (NLTK y spaCy).<br><br>Naive Bayes, Random Forest, XGBoost y una red neuronal en Keras se ajustaron con validación cruzada y se combinaron en un ensamble por votación que alcanzó 0.92 de F1 en validación."
      image: "assets/nlp.png"
      url: "https://github.com/maxogod/DATA-SCIENCE/blob/main/TP2/7506R_TP2_GRUPO02_REPORTE.pdf"
      vid: ""
      technologies:
          [
              "Machine Learning",
              "Python",
              "TensorFlow",
              "ScikitLearn",
              "Pandas",
              "GoogleColab",
          ]
    - name: "Extracción, Transformación y Carga de Datos Inmobiliarios"
      short_name: "real-estate-etl"
      description: "Pipeline ETL sobre un dataset de Kaggle con más de un millón de ventas inmobiliarias (2001 a 2020), desarrollado para la materia Bases de Datos.<br><br>Características principales:<br>- Limpieza de datos: manejo de nulos, filtrado de outliers con z-score, estandarización de formatos y eliminación de duplicados.<br>- Rediseño del esquema y carga en una base SQLite normalizada a la Forma Normal de Boyce-Codd (BCNF).<br>- Validación de integridad reconstruyendo el dataset original a partir de las tablas normalizadas."
      image: "assets/etl.png"
      url: "https://github.com/maxogod/ETL-Real-Estate/blob/main/informe.pdf"
      vid: ""
      technologies: ["Python", "GoogleColab", "Pandas", "SQL"]
