sys_projects:
    - name: "Feed the Realm"
      short_name: "feed-the-realm"
      description: "Plataforma MMO RPG Maker donde los jugadores construyen mundos 3D persistentes con un World Editor sin código, los publican y los juegan en línea junto a cientos de jugadores concurrentes.<br><br>Cada mundo se divide en zonas, y cada una es un servidor autoritativo de Unity en modo headless que corre en su propio contenedor Docker, desplegado bajo demanda y escalado horizontalmente. Un servicio en Go (Gin), diseñado como monolito modular detrás de un API Gateway en Nginx, gestiona autenticación, assets, pagos con Stripe y la orquestación de mundos, respaldado por PostgreSQL y una base de datos MongoDB por mundo que mantiene el estado del jugador consistente entre zonas.<br><br>Características principales:<br>- Infraestructura en AWS definida como código con Terraform: EC2, S3 + CDN CloudFront, ECR, DNS público/privado en Route 53, IAM con mínimos privilegios y secretos gestionados con SSM.<br>- Orquestación de servidores de juego bajo demanda con HashiCorp Nomad (elegido por sobre Kubernetes para no reprogramar sesiones en vivo) y descubrimiento de servicios con Consul por ID de mundo/zona.<br>- Networking con autoridad del servidor sobre KCP/UDP con Mirror y Protobuf, un game loop de tick fijo y límites de comandos por tick para absorber picos de tráfico.<br>- CI/CD con GitHub Actions y despliegues sin credenciales estáticas vía OIDC, cobertura de tests superior al 75%, tests de aceptación BDD, escaneo de secretos y vulnerabilidades, y redespliegue automático de los servidores de juego activos en cada release.<br>- Observabilidad con Datadog mediante métricas personalizadas a nivel de tick, dashboards y alertas.<br>- Pruebas de carga con bots propios: ~550 jugadores concurrentes en 7 zonas sobre dos nodos de 2 vCPU / 2 GB con duración de tick estable."
      image: "assets/ftr.jpg"
      url: "https://github.com/FeedTheRealm-org"
      vid: ""
      technologies:
          [
              "Distributed Systems",
              "AWS",
              "Terraform",
              "Nomad",
              "Go",
              "Unity",
              "Datadog",
          ]
    - name: "ClassConnect"
      short_name: "classconnect"
      description: "ClassConnect es una plataforma educativa cloud-native construida sobre una arquitectura distribuida de microservicios. Cuenta con un despliegue en Kubernetes, gestionado mediante Infrastructure as Code y automatizado con pipelines CI/CD. El monitoreo se realiza con Datadog para lograr una observabilidad completa.<br><br>El sistema soporta una aplicación móvil en React Native (para docentes y estudiantes) y una aplicación web en React (para administradores). Incluye seis microservicios desarrollados en Go (Gin Gonic) y Python (FastAPI), cada uno con su propia base de datos utilizando Supabase o MongoDB Atlas, todos con una cobertura de tests superior al 75%. Un microservicio adicional de IA, impulsado por Gemini 2.0 Flash, permite asistencia basada en modelos LLM."
      image: "assets/cc.png"
      url: "https://github.com/ClassConnect-org"
      vid: "https://www.youtube.com/watch?v=MnToP9unGNQ"
      technologies:
          [
              "Microservices",
              "Datadog",
              "Cloud-Computing",
              "LLM",
              "Kubernetes",
              "Kong-Gateway",
          ]
    - name: "Sistema Distribuido de Análisis de Ventas"
      short_name: "sales-analysis"
      description: "Sistema distribuido tolerante a fallos diseñado para procesar y analizar grandes volúmenes de datos transaccionales.<br><br>La arquitectura se basa en un pipeline orientado a mensajes utilizando RabbitMQ, donde nodos trabajadores independientes procesan los datos por etapas, habilitando escalabilidad horizontal y alto rendimiento.<br><br>Las principales características incluyen:<br>- Pipelines distribuidos de extremo a extremo para filtrado, agregación, ranking y joins.<br>- Alta tolerancia a fallos mediante ACKs diferidos, persistencia en disco, mensajes idempotentes y manejo de duplicados.<br>- Recuperación automática de nodos.<br>- Robustez, consistencia y resiliencia frente a fallas parciales y catastróficas."
      image: "assets/distro.jpg"
      url: "https://github.com/maxogod/distributed-processing-pipeline"
      vid: "https://youtu.be/L9Zhzpqamks"
      technologies:
          [
              "Distributed Systems",
              "RabbitMQ",
              "Docker",
              "Go",
              "Python",
          ]
    - name: "Firewall SDN"
      short_name: "sdn-firewall"
      description: "Solución de Software-Defined Networking (SDN) que implementa un firewall dinámico utilizando POX y Mininet.<br><br>El proyecto sigue una arquitectura modular basada en Docker que separa la lógica de emulación de red del controlador, y está desarrollado en Python 3 (con parches personalizados para compatibilidad con POX).<br><br>Características principales:<br>- Configuración basada en JSON para definir reglas de filtrado por IP, puerto y protocolo.<br>- Control centralizado del tráfico mediante switches OpenFlow gestionados con POX.<br>- Validación de tráfico con Mininet y Wireshark, usando tests automatizados.<br><br>El sistema permite bloquear tráfico HTTP, descartar flujos UDP y limitar la comunicación entre hosts específicos. También aborda desafíos como la migración a Python 3 y pruebas en topologías complejas."
      image: "assets/firewall.jpg"
      url: ""
      vid: ""
      technologies: ["Pox", "Mininet", "Wireshark", "Python"]
    - name: "Protocolo RDT sobre UDP"
      short_name: "rdt-udp"
      description: "Protocolo confiable de transferencia de archivos construido sobre UDP. El proyecto implementa dos estrategias de recuperación de errores—Stop-and-Wait y Go-Back-N—diseñadas para tolerar pérdidas de paquetes y mantener la integridad de la conexión.<br><br>El servidor tiene una arquitectura asíncrona que soporta múltiples clientes simultáneos, con encabezados personalizados para seguimiento de secuencia y confirmaciones.<br><br>Características principales:<br>- Encabezado de 6 bytes a nivel de aplicación con soporte de secuencia/ACK.<br>- Multiplexado de conexiones con lógica basada en eventos.<br>- Pruebas en Mininet: Go-Back-N fue 2.8× más rápido que Stop-and-Wait bajo 20% de pérdida de paquetes.<br><br>El proyecto se enfocó en construir un protocolo liviano y robusto con buena tolerancia a fallos y análisis de rendimiento en redes emuladas."
      image: "assets/udp.jpg"
      url: "https://github.com/maxogod/RDT-over-UDP"
      vid: ""
      technologies: ["Mininet", "Wireshark", "Python"]
    - name: "ConcuRide"
      short_name: "concuride"
      description: "Sistema distribuido tolerante a fallos para el emparejamiento de viajes, desarrollado en Rust sobre el modelo de actores (Actix), con cuatro aplicaciones independientes (pasajeros, conductores, nodos administradores y una pasarela de pagos) que se comunican por TCP.<br><br>Un clúster de nodos administradores replicados elige un coordinador mediante un algoritmo de elección en anillo y sigue asignando viajes aun cuando fallan nodos o clientes.<br><br>Características principales:<br>- Concurrencia sin locks: el estado pertenece a los actores y se protege con sus mailboxes en lugar de bloqueos.<br>- Reelección automática del coordinador y failover de los clientes cuando este cae.<br>- Flujo de viaje con autorización de pago, asignación del conductor más cercano y distribución de carga round-robin entre administradores.<br>- Recuperación ante desconexiones en cualquier punto del viaje, con prevención de doble cobro y descarte de conductores que no responden."
      image: "assets/concuride.jpg"
      url: "https://github.com/maxogod/ConcuRide"
      vid: "https://www.youtube.com/watch?v=8ktItIcETTw&ab_channel=MaxoFiuba"
      technologies: ["Rust"]
    - name: "Visita mi github para mas!"
      more: true
      description: ""
      image: "assets/gh.png"
      url: "https://github.com/maxogod"
      vid: ""
      technologies: []

